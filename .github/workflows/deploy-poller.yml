name: Deploy Poller

on:
  push:
    branches: [main]
    paths:
      - 'poller/**'
      - 'shared/**'
      - 'Dockerfile.poller'
      - 'cloudbuild.yaml'
      - 'infra/deploy-poller.sh'
      - '.github/workflows/deploy-poller.yml'

jobs:
  deploy:
    name: Build & deploy Cloud Run poller
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: classcharts

      - name: Deploy poller
        run: bash infra/deploy-poller.sh
        env:
          GCP_PROJECT_ID: classcharts
          GCP_REGION: europe-west2
