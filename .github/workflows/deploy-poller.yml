name: Deploy Poller

on:
  push:
    branches: [main]
    paths:
      - 'poller/**'
      - 'shared/**'
      - 'Dockerfile.poller'
      - 'cloudbuild.yaml'
      - 'infra/deploy-poller.sh'
      - '.github/workflows/deploy-poller.yml'

jobs:
  preflight:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            poller/package-lock.json

      - name: Install shared
        run: cd shared && npm ci --ignore-scripts

      - name: Build shared
        run: cd shared && npm run build

      - name: Install poller
        run: cd poller && npm ci --ignore-scripts

      - name: TypeScript check
        run: cd poller && npx tsc --noEmit

  deploy:
    name: Build & deploy Cloud Run poller
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: classcharts

      - name: Deploy poller
        run: bash infra/deploy-poller.sh
        env:
          GCP_PROJECT_ID: classcharts
          GCP_REGION: europe-west2
