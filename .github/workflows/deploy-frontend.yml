name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'infra/deploy-frontend.sh'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shared/package-lock.json

      - name: Install shared
        run: cd shared && npm ci --ignore-scripts

      - name: Build shared
        run: cd shared && npm run build

      - name: Install frontend
        run: cd frontend && npm install --ignore-scripts

      - name: Copy shared into vendor
        run: |
          mkdir -p frontend/vendor/shared
          cp -r shared/dist frontend/vendor/shared/
          cp shared/package.json frontend/vendor/shared/
          cd frontend/vendor/shared && npm install --production --ignore-scripts

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: ESLint
        run: cd frontend && npm run lint -- --max-warnings 0
        continue-on-error: true  # warn only for now — tighten later

      - name: Build check
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: preflight
          NEXT_PUBLIC_DEPLOYED_AT: preflight

  deploy:
    name: Deploy to App Engine
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: classcharts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy frontend
        run: bash infra/deploy-frontend.sh
        env:
          GCP_PROJECT_ID: classcharts
          GITHUB_SHA: ${{ github.sha }}
